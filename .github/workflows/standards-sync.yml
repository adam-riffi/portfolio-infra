name: standards-sync

on:
  push:
    branches: [main]
    paths: [templates/ENGINEERING.md, standards/repos.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standards-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'adam-riffi/portfolio-infra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Open or update sync PRs
        env:
          STANDARDS_SYNC_TOKEN: ${{ secrets.STANDARDS_SYNC_TOKEN }}
        run: node standards/main.ts

name: drive-sync
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: List planned changes without downloading or writing
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
concurrency:
  group: drive-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'adam-riffi/portfolio-infra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate configuration
        env:
          FOLDER: ${{ vars.GDRIVE_FOLDER_ID }}
          PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          test -n "$FOLDER" || { echo 'Set GDRIVE_FOLDER_ID.'; exit 1; }
          if [ -n "$PROVIDER" ]; then
            test -n "$ACCOUNT" || { echo 'Set GCP_SERVICE_ACCOUNT for WIF.'; exit 1; }
          else
            test -n "$KEY" || { echo 'Configure WIF, or the documented GDRIVE_SA_KEY fallback.'; exit 1; }
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Authenticate with WIF
        id: wif
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
      - name: Authenticate with key fallback
        id: key
        if: vars.GCP_WIF_PROVIDER == ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GDRIVE_SA_KEY }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
      - name: Synchronize
        env:
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.key.outputs.access_token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then pnpm sync --dry-run; else pnpm sync; fi
      - name: Publish generated assets if changed
        if: inputs.dry-run != true
        run: |
          git add -- memes
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(memes): sync from Drive [skip ci]'
          git push origin HEAD:main
